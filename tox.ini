[tox]
env_list = ruff, mypy, py310, py311, py312, py313, py314
requires = tox-uv
isolated_build = true

[testenv]
basepython = python3.13
deps = 
    pytest
    pytest-asyncio
commands = pytest {posargs:tests}

[testenv:ruff]
deps = 
    ruff
commands = ruff check {posargs:src}

[testenv:mypy]
deps = 
    mypy
commands = mypy {posargs:src}

[testenv:py310]
basepython = python3.10

[testenv:py311]
basepython = python3.11

[testenv:py312]
basepython = python3.12

[testenv:py313]
basepython = python3.13

[testenv:py314]
basepython = python3.14
